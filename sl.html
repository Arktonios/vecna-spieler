<style>

.pic{position:fixed;inset:0;z-index:300;background:#fff;display:flex;align-items:center;justify-content:center}.pic img{max-width:100%;max-height:100%;object-fit:contain}
.pb{background:#e9e2f3;border-color:#8a74b0}
.full{position:fixed;inset:0;height:100dvh;z-index:60;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(60px + max(env(safe-area-inset-bottom),24px))}

.sub{border-top:1px solid var(--line);padding-top:4px}

.sb h2.sbn{text-align:center;font-size:34px;font-weight:500;letter-spacing:.5px;margin:6px 0 8px;color:var(--txt)}

.sb .kv{margin:7px 0}.sb .kv b{color:var(--txt)}

.mod{background:#fde7ef;border:2px solid #c2185b;border-left:8px solid #c2185b;border-radius:10px;padding:8px 12px;margin:10px 0;box-shadow:0 2px 6px #c2185b33}

.kq{background:var(--head);color:#fff;border-radius:12px 12px 2px 12px;padding:8px 12px;margin:10px 0 6px auto;max-width:88%;width:fit-content;font-size:15px}
.ka{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:6px 12px;margin:6px 0}

.swrap{position:relative;margin-bottom:6px;border-radius:10px;overflow:hidden}
.swrap .cmb{margin:0;position:relative;z-index:1;transition:transform .2s ease;touch-action:pan-y}
.swdel{position:absolute;right:0;top:0;bottom:0;width:110px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:700;font-size:16px}

.dlg{background:var(--bg);border-radius:14px;padding:18px;width:100%;max-width:400px;box-shadow:0 10px 30px #0005}
button.danger{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}
button:disabled{opacity:.45}
body.emb nav{display:none!important}
body.emb main{padding-bottom:28px}
</style>

<body>
<div id="lock"><div class="card">
<h2 style="margin-top:0;color:var(--txt)">Vecna – SL-Begleiter</h2>
<p class="mut">Inhalt ist verschlüsselt. Passwort eingeben:</p>
<input id="pw" type="password" autocomplete="current-password" style="width:100%;margin-bottom:10px" placeholder="Passwort">
<label class="row mut" style="margin-bottom:12px"><input id="rem" type="checkbox" checked> auf diesem Gerät merken</label>
<button class="pri" id="unlock" style="width:100%">Öffnen</button>
<p id="err" style="color:var(--red)"></p>
<p id="stinfo" class="mut" style="font-size:.8em;margin:0"></p>
</div></div>

<header><h1 id="ttl">Vecna</h1><button class="sm" id="ctx" title="Kontext für Claude kopieren">📋 Kontext</button></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="ov"></div>

<script id="payload" type="application/json">{"salt": "t4pC3m04SPoMcgg+HfOT0A==", "iv": "fIX8wOn1YXKvk2+q", "iter": 250000, "v": "76752f2774", "ext": ["sl1.bin", "sl2.bin", "sl3.bin", "sl4.bin", "sl5.bin", "sl6.bin"]}</script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const EMB=!!window.VECNA_EMB;if(EMB)document.body.classList.add("emb");
const EQ=[];function eNach(m){if(!S){EQ.push(m);return}
  if(m.typ==="tab"){const ok=["kapitel","kampf","notiz","ki","karte"];if(ok.includes(m.tab)){S.tab=m.tab;save();closeOv&&closeOv();render();$("#main").scrollTop=0}}
  else if(m.typ==="area"){if(m.kap&&D.chapters.some(c=>c.id===m.kap)&&S.chapter!==m.kap){S.chapter=m.kap;S.map=chap().maps[0].id}
    let id=m.id;if(!findArea(id)){const k=String(id).replace(/[a-z]+$/,"");if(findArea(k))id=k}
    if(!findArea(id)){toast(m.id+": kein Eintrag im Buch");return}
    if(S.tab==="karte")S.tab="kapitel";save();render();openArea(id)}
  else if(m.typ==="kitext"||m.typ==="kifertig"||m.typ==="kifehler"){const w=KIW[m.id];if(!w)return;
    if(m.typ==="kitext"){w.t=m.text;w.on&&w.on({text:m.text})}
    else if(m.typ==="kifertig"){delete KIW[m.id];w.ok({text:m.text})}
    else{delete KIW[m.id];const e=new Error(m.msg||"Fehler");e.code=m.code;if(m.name)e.name=m.name;if(w.t)e.text=w.t;w.no(e)}}}
const KIW={};let KIN=0;
function kiProxy(msgs,o){o=o||{};return new Promise((ok,no)=>{const id=++KIN;KIW[id]={ok,no,on:o.onText,t:""};
  if(o.signal)o.signal.addEventListener("abort",()=>{parent.postMessage({typ:"kiabbruch",id},"*")});
  parent.postMessage({typ:"ki",id,msgs},"*")})}
if(EMB){window.addEventListener("message",e=>{if(e.source!==parent)return;const m=e.data;if(m&&m.typ){if(/^ki/.test(m.typ)&&S)eNach(m);else eNach(m)}});
  setTimeout(()=>parent.postMessage({typ:"slgeladen"},"*"),0)}
let D=null, S=null; const SKEY="vecna-sl-state-v1", PKEY="vecna-sl-pw";
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decrypt(pw){
  const P=JSON.parse($("#payload").textContent);
  let CT;
  if(P.ext){if(!decrypt.buf){const L=Array.isArray(P.ext)?P.ext:[P.ext];const bufs=await Promise.all(L.map(async f=>{const r=await fetch(f+"?v="+P.v);if(!r.ok)throw new Error("nofile");return new Uint8Array(await r.arrayBuffer())}));const n=bufs.reduce((s,x)=>s+x.length,0);const all=new Uint8Array(n);let o=0;for(const x of bufs){all.set(x,o);o+=x.length}if(P.v){const h=[...new Uint8Array(await crypto.subtle.digest("SHA-1",all))].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,P.v.length);if(h!==P.v)throw new Error("mismatch")}decrypt.buf=all}CT=decrypt.buf}else CT=b64(P.ct);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.iter,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},key,CT);
  return JSON.parse(new TextDecoder().decode(pt));
}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return localStorage.getItem(k)===v}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function ckGet(k){try{const m=document.cookie.split("; ").find(x=>x.startsWith(k+"="));return m?decodeURIComponent(m.slice(k.length+1)):null}catch(e){return null}}
function ckSet(k,v){try{document.cookie=k+"="+encodeURIComponent(v)+"; max-age=31536000; path=/; SameSite=Lax"+(location.protocol==="https:"?"; Secure":"")}catch(e){}}
function ckDel(k){try{document.cookie=k+"=; max-age=0; path=/"}catch(e){}}
function pwGet(){return lsGet(PKEY)||ckGet(PKEY)}
function pwSet(pw){const ok=lsSet(PKEY,pw);ckSet(PKEY,pw);return ok||ckGet(PKEY)===pw}
function pwDel(){lsDel(PKEY);ckDel(PKEY)}
(()=>{let ok=false;try{const t="vecna-probe";localStorage.setItem(t,"1");ok=localStorage.getItem(t)==="1";localStorage.removeItem(t)}catch(e){}
  if(!ok){const i=document.getElementById("stinfo");if(i)i.textContent="⚠️ Dieser Browser erlaubt hier keinen dauerhaften Speicher (privater Modus oder eingebettete Ansicht). Passwort, Notizen und Kampfstand gehen beim Schließen verloren."}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}})();
async function tryUnlock(pw,remember,auto){
  $("#err").textContent=auto?"Lade …":"";
  try{D=await decrypt(pw)}catch(e){
    if(e&&e.message==="mismatch"){$("#err").textContent="Die Datendateien passen nicht zu dieser index.html (andere Version). index.html, data1 und data2 immer zusammen hochladen.";decrypt.buf=null;return}
    if(e&&e.message==="nofile"){$("#err").textContent="Datendateien (data1.bin, data2.bin …) fehlen neben index.html.";return}
    if(!(e&&e.name==="OperationError")){$("#err").textContent="Laden fehlgeschlagen (Netz?). Gespeichertes Passwort bleibt erhalten – bitte nochmal „Öffnen“ tippen.";if(auto)$("#pw").value=pw;decrypt.buf=null;return}
    $("#err").textContent="Falsches Passwort.";pwDel();return}
  const _saved=remember?pwSet(pw):true;
  $("#lock").remove();init();try{LASTC=JSON.stringify(S.combat)}catch(e){}
  if(!_saved)setTimeout(()=>{try{toast("⚠️ Passwort konnte hier nicht gespeichert werden (privater Modus?)")}catch(e){}},600);
}
$("#unlock").onclick=()=>tryUnlock($("#pw").value,$("#rem").checked);
$("#pw").onkeydown=e=>{if(e.key==="Enter")$("#unlock").click()};
(()=>{const p=pwGet();if(p)tryUnlock(p,true,true)})();

function defState(){return{tab:"karte",chapter:D.chapters[0].id,map:D.chapters[0].maps[0].id,zoom:1,done:{},cur:null,
  secrets:Object.assign({},D.secretsInit),npc:{},loot:"",notes:"",log:[],combat:{list:[],turn:0,round:1}}}
function load(){try{const raw=lsGet(SKEY);S=JSON.parse(raw?raw.replace(/\bLenifi\b/g,"Lemiphi").replace(/\bPelias\b/g,"Pellias").replace(/\bBrock\b/g,"Brokk").replace(/\bLilia\b/g,"Lillia"):raw)}catch(e){}if(!S)S=defState();S=Object.assign(defState(),S)}

const UNDO=[];let LASTC=null,NOUNDO=false;
function trackCombat(){if(!S)return;const cur=JSON.stringify(S.combat);if(LASTC!==null&&cur!==LASTC&&!NOUNDO){UNDO.push(LASTC);if(UNDO.length>60)UNDO.shift()}LASTC=cur}

const MOD=s=>/^!! /m.test(s||"")?' <span class="modb">🛠️</span>':"";
function md(src){
  const lines=String(src||"").split("\n");let h="",inUl=false,inTbl=false,tbl=[];
  const il=s=>esc(s).replace(/Mordenkainen\*/g,"Mordenkainen&#42;").replace(/\*\*\*(.+?)\*\*\*/g,"<b><i>$1</i></b>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
  const flushT=()=>{if(!inTbl)return;h+="<table>"+tbl.filter(r=>!/^\|?\s*-/.test(r)).map((r,i)=>"<tr>"+r.replace(/^\||\|$/g,"").split("|").map(c=>`<${i?"td":"th"}>${il(c.trim())}</${i?"td":"th"}>`).join("")+"</tr>").join("")+"</table>";inTbl=false;tbl=[]};
  for(const ln of lines){
    const t=ln.trim();
    if(t.startsWith("|")){if(inUl){h+="</ul>";inUl=false}inTbl=true;tbl.push(t);continue}else flushT();
    if(/^[-•] /.test(t)){if(!inUl){h+="<ul>";inUl=true}h+="<li>"+il(t.slice(2))+"</li>";continue}
    if(inUl){h+="</ul>";inUl=false}
    if(!t){continue}
    if(t.startsWith("!! ")){const body="<p>"+il(t.slice(3))+"</p>";if(h.endsWith("</div><!--mod-->"))h=h.slice(0,-"</div><!--mod-->".length)+body+"</div><!--mod-->";else h+='<div class="mod"><div class="modh">🛠️ EIGENE ANPASSUNG · nicht im Buch</div>'+body+"</div><!--mod-->";continue}
    if(t.startsWith("### "))h+="<h3>"+il(t.slice(4))+"</h3>";
    else if(t.startsWith("> "))h+="<blockquote>"+il(t.slice(2))+"</blockquote>";
    else h+="<p>"+il(t)+"</p>";
  }
  flushT();if(inUl)h+="</ul>";return h;
}

const RD=s=>(/^> /m.test(s||"")?" 🗣️":"")+MOD(s);
const PG=p=>p?` <span class="pg">S. ${p}</span>`:"";

let CRX=null;
function crRegex(){if(CRX)return CRX;CRX=[];const norm=t=>t.toLowerCase().replace(/[„“"(),.·:]/g," ").replace(/\s+/g," ").trim();
  for(const [id,c] of Object.entries(D.creatures)){const nm=norm(c.name.replace(/\s*\(.*\)\s*$/,"").replace(/\s*„.*$/,""));if(nm.length<4)continue;
    const parts=nm.split(" ").map(w=>{let x=w;if(x.length>5)x=x.replace(/(er|en|e|n|s)$/,"");return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+(w.length>3?"[a-zäöüß]{0,3}":"")});
    CRX.push([id,new RegExp("(^|[^a-zäöüß])"+parts.join("\\s+")+"($|[^a-zäöüß])")])}
  return CRX}
function crMentions(text,extra){const norm=t=>t.toLowerCase().replace(/[„“"(),.·:]/g," ").replace(/\s+/g," ");
  const spans=[];String(text||"").replace(/(^|[^*])\*\*([^*]+?)\*\*(?!\*)/g,(m,a,b)=>{spans.push(" "+norm(b)+" ")});
  const ids=new Set(extra||[]);const big=spans.join(" | ");
  for(const [id,re] of crRegex())if(re.test(big))ids.add(id);
  return [...ids]}
function crChips(ids){return ids.length?`<div class="row" style="gap:6px;margin:6px 0">${ids.map(k=>`<button class="sm" data-cr="${k}">🐉 ${esc((D.creatures[k]||{}).name||k)}</button>`).join("")}</div>`:""}

function statNums(md){const hp=(md||"").match(/Trefferpunkte\*\*\s*(\d+)/),ac=(md||"").match(/Rüstungsklasse\*\*\s*(\d+)/);return{hp:hp?+hp[1]:null,ac:ac?+ac[1]:null}}

function sb(c){
  const src=String(c.md||"");const L=src.split("\n");
  const il=t=>esc(t).replace(/\*\*\*(.+?)\*\*\*/g,"<b><i>$1</i></b>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
  let type="",notes=[],top=[],rest=[],tbl=[],body=[],seenTbl=false,i=0;
  const TOP=/^(Herausforderungsgrad|Rüstungsklasse|Trefferpunkte|Bewegungsrate)$/;
  for(;i<L.length;i++){const t=L[i].trim();
    if(t.startsWith("### ")||/^\*\*\*/.test(t))break;
    if(!t)continue;
    if(t.startsWith("⚠️")||t.startsWith("> ")){notes.push(t.replace(/^> /,""));continue}
    if(!type&&/^\*[^*].*\*$/.test(t)){type=t.slice(1,-1);continue}
    if(t.startsWith("|")){tbl.push(t);seenTbl=true;continue}
    const m=t.match(/^\*\*(.+?)\*\*\s*(.*)$/);
    if(m){(TOP.test(m[1])?top:rest).push([m[1],m[2]]);continue}
    (seenTbl?rest:top).push(["",t]);
  }
  top.sort((a,b)=>(a[0]==="Herausforderungsgrad"?-1:0)-(b[0]==="Herausforderungsgrad"?-1:0));
  const kv=a=>a.map(([k,v])=>`<div class="kv">${k?`<b>${esc(k)}:</b> `:""}${il(v)}</div>`).join("");
  let ab="";const rows=tbl.filter(r=>!/^\|?\s*-/.test(r)).map(r=>r.replace(/^\||\|$/g,"").split("|").map(x=>x.trim()));
  if(rows.length>=2){ab=`<div class="ab">`+rows[0].map((h,j)=>{const v=rows[1][j]||"";const mm=v.match(/^(\d+)\s*\(([^)]+)\)/);return `<div><div class="l">${esc(h)}</div><div class="m">${esc(mm?mm[2]:v)}</div><div class="s">${esc(mm?mm[1]:"")}</div></div>`}).join("")+`</div>`}
  // body
  let h="",sec=null,ul=false;const open=t=>{h+=`<hr><h3>${esc(t)}</h3>`};
  for(;i<L.length;i++){let t=L[i].trim();if(!t){continue}
    if(t.startsWith("### ")){if(ul){h+="</ul>";ul=false}open(t.slice(4));sec=1;continue}
    if(!sec){open("Eigenschaften");sec=1}
    if(/^[-•] /.test(t)){if(!ul){h+="<ul>";ul=true}h+="<li>"+il(t.slice(2))+"</li>";continue}
    if(ul){h+="</ul>";ul=false}
    const m=t.match(/^\*\*\*(.+?)\*\*\*\s*(.*)$/);
    if(m){const txt=il(m[2]).replace(/\s*<i>Treffer:<\/i>/g,"<br><i>Treffer:</i>");h+=`<div class="tr"><span class="n">${esc(m[1].replace(/\.$/,""))}</span>${txt}</div>`}
    else h+=`<div class="tr">${il(t)}</div>`;
  }
  if(ul)h+="</ul>";
  return `<div class="sb">${notes.map(n=>`<div class="note">${il(n)}</div>`).join("")}<h2 class="sbn">${esc(c.name.replace(/ \(.*\)$/,""))}</h2>${type?`<div class="ban">${il(type)}</div>`:""}${kv(top)}${ab?`<hr>${ab}`:""}${rest.length?`<hr>${kv(rest)}`:""}${h}</div>`;
}
function openCreature(id,back){

  const bl=toArea?"":back==="kampf"?"‹ Zurück zum Kampf":back==="kapitel"?"‹ Zurück zum Kapitel":back?`‹ ${back}`:"";

   ${c.md?sb(c):`<div class="md"><p style="color:var(--red)">${D.missing}</p></div>`}

  const c=cid?D.creatures[cid]:null;const n=statNums(c&&c.md);

  const same=S.combat.list.filter(x=>x.base===base).length;
  S.combat.list.push({id:Math.random().toString(36).slice(2),base,name:base+(cid&&same?" "+(same+1):""),cid:cid||null,ini:"",hp:n.hp,max:n.hp,ac:n.ac,note:"",pc:!cid});
}
function longPress(el,fn,ms=650){let t=null,moved=false;
  const start=e=>{moved=false;el.classList.add("pressing");t=setTimeout(()=>{t=null;el.classList.remove("pressing");if(navigator.vibrate)navigator.vibrate(30);fn()},ms)};
  const stop=()=>{if(t){clearTimeout(t);t=null}el.classList.remove("pressing")};
  el.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener("contextmenu",e=>e.preventDefault());
  return ()=>t===null&&false;
}

   <div style="margin-top:8px;max-height:220px;overflow:auto;font-size:14px">${S.log.map((l,i)=>`<div class="mut row" style="padding:3px 0;border-bottom:1px solid var(--line);justify-content:space-between;flex-wrap:nowrap"><span>${esc(l)}</span><button class="sm" data-dl="${i}" style="padding:2px 9px;flex:none">✕</button></div>`).join("")}</div></div>
  <div class="card"><b>NSC-Status</b>${c.npcs.map(n=>`<div class="it row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(n)}</span><select data-n="${esc(n)}">${NSTAT.map(s=>`<option ${(S.npc[n]||"?")===s?"selected":""}>${s}</option>`).join("")}</select></div>`).join("")}</div>
  <div class="card"><b>Beute</b><textarea id="loot" rows="5" style="width:100%;margin-top:6px">${esc(S.loot)}</textarea></div>
  <div class="card"><b>Freie Notizen</b><textarea id="notes" rows="8" style="width:100%;margin-top:6px">${esc(S.notes)}</textarea></div>
  <div class="card"><b>Sicherung</b><div class="row" style="margin-top:6px"><button class="sm" id="exp">Stand exportieren</button><button class="sm" id="imp">Stand importieren</button><button class="sm" id="lo">Abmelden</button></div>
   <p class="mut" style="font-size:13px">Der Spielstand liegt nur auf diesem Gerät. Exportieren kopiert ihn in die Zwischenablage.</p></div>
  <h3 style="margin:18px 2px 6px">🤫 Geheimnisse</h3><div id="geh"></div>`;
  $("#add").onclick=()=>{const v=$("#ev").value.trim();if(!v)return;addLog(v);save();rNotiz()};
  $("#ev").onkeydown=e=>{if(e.key==="Enter")$("#add").click()};
  $("#main").querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dl;ask("Eintrag löschen?\n"+S.log[i],"Löschen",true).then(ok=>{if(ok){S.log.splice(i,1);save();rNotiz()}})});
  $("#main").querySelectorAll("[data-n]").forEach(e=>e.onchange=()=>{S.npc[e.dataset.n]=e.value;addLog(`${e.dataset.n}: ${e.value}`);save()});
  $("#loot").oninput=e=>{S.loot=e.target.value;save()};
  $("#notes").oninput=e=>{S.notes=e.target.value;save()};
  $("#exp").onclick=()=>clip(JSON.stringify(S),"Spielstand kopiert");
  $("#imp").onclick=async()=>{const v=await askText("Exportierten Spielstand einfügen:","",true);if(!v)return;try{S=Object.assign(defState(),JSON.parse(v));save();toast("Importiert");render()}catch(e){toast("Ungültiger Spielstand")}};
  $("#lo").onclick=()=>{pwDel();location.reload()};
  rGeheim();
}

/* ---------- Claude ---------- */
const PROJ="https://claude.ai/project/01a1ab6e-3dc8-747a-a451-4823acd49bc8";
let SAMPLE=null,KI_BUSY=null;
function initSample(){if(EMB){SAMPLE=SAMPLE||kiProxy;return}try{if(window.claude&&window.claude.use&&!initSample.p){initSample.p=window.claude.use("sample").then(x=>{SAMPLE=x;if(S.tab==="ki")rKI()}).catch(()=>{})}}catch(e){}}
initSample();setTimeout(initSample,1500);setTimeout(initSample,5000);
function bookContext(){
  const c=chap();const f=S.cur?findArea(S.cur):null;
  let t=`### Kapiteltext (${c.title}) – Abschrift aus dem Buch des SL; Zeilen mit "!!" sind eigene Anpassungen des SL\n`;
  c.sections.forEach(x=>t+=`\n## ${x.title}${x.page?` (S. ${x.page})`:""}\n${x.md}\n`);
  c.maps.forEach(m=>m.areas.forEach(a=>{t+=`\n## ${a.id}: ${a.name}${a.page?` (S. ${a.page})`:""}\n${a.read?"Vorlesetext: "+a.read+"\n":""}${a.info}\n${a.creatures.length?"Kreaturen: "+a.creatures.map(k=>(D.creatures[k]||{}).name||k).join(", ")+"\n":""}`}));
  const cr=new Set();c.maps.forEach(m=>m.areas.forEach(a=>a.creatures.forEach(k=>cr.add(k))));
  if(f)f.a.creatures.forEach(k=>cr.add(k));
  t+=`\n### Werteblöcke (Kapitel)\n`;cr.forEach(k=>{const x=D.creatures[k];if(x&&x.md)t+=`\n## ${x.name} (${x.src})\n${x.md}\n`});
  t+=`\n### Gruppe\n${(D.party||[]).map(p=>typeof p==="string"?p:(p.name||JSON.stringify(p))).join(", ")}\n`;
  return t;
}
const KI_SYS=`Du bist der Assistent eines Spielleiters (D&D 5e, Abenteuer „Vecna: Vorabend der Verdammnis“, deutsche Ausgabe). Antworte auf Deutsch, knapp und spieltischtauglich: konkrete Vorschläge, SG/Würfe, Zitate für NSC in wörtlicher Rede. Halte dich an den mitgelieferten Kapiteltext; markiere Eigenes als Vorschlag. Keine Einleitung, keine Floskeln. Kennzeichne Unsicheres mit [Vermutung]. Formatierung: kurze Absätze, **fett** für Schlüsselbegriffe, Listen mit "- ".`;
function rKI(){
  initSample();
  if(!SAMPLE)return rKIlink();
  S.kiChat=S.kiChat||[];
  const f=S.cur?findArea(S.cur):null;
  $("#main").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>🤖 Claude fragen</b><button class="sm" id="knw">Neues Gespräch</button></div>
   <p class="mut" style="font-size:13px;margin:4px 0 8px">Kontext: <b>${esc(chap().title)}</b>${f?` · Ort <b>${f.a.id} ${esc(f.a.name)}</b>`:""} · Gruppe, Kampf, Geheimnisse, Notizen und Kapiteltext werden automatisch mitgeschickt.</p>
   <div id="kchat">${S.kiChat.map(m=>m.role==="user"?`<div class="kq">${esc(m.show||m.content)}</div>`:`<div class="ka md">${md(m.content)}</div>`).join("")}</div>
   <div id="kout"></div>
   <textarea id="kq" rows="4" style="width:100%;margin-top:8px" placeholder="Was machen die Spieler? Was willst du wissen?">${esc(S.kiDraft||"")}</textarea>
   <div class="row" style="margin-top:6px;gap:6px">${["Wie reagiert der NSC?","Was passiert jetzt?","Welcher Wurf / welcher SG?","Improvisiere eine Szene"].map(s=>`<button class="sm" data-qs="${s}">${s}</button>`).join("")}</div>
   <div class="row" style="margin-top:10px;gap:8px"><button class="pri" id="kgo" style="flex:1;padding:14px">Fragen</button><button id="kstop" style="display:none">Stopp</button></div>
  </div>`;
  $("#kq").oninput=()=>{S.kiDraft=$("#kq").value;save()};
  $("#main").querySelectorAll("[data-qs]").forEach(b=>b.onclick=()=>{$("#kq").value=($("#kq").value?$("#kq").value+" ":"")+b.dataset.qs;S.kiDraft=$("#kq").value;save()});
  $("#knw").onclick=()=>{S.kiChat=[];save();rKI()};
  $("#kstop").onclick=()=>{if(KI_BUSY)KI_BUSY.abort()};
  $("#kgo").onclick=async()=>{
    const q=$("#kq").value.trim();if(!q||KI_BUSY)return;
    const first=!S.kiChat.length;
    const content=first?`${KI_SYS}\n\n${bookContext()}\n\n### Aktueller Spielstand\n${buildContext(q).replace(/\n\nBitte hilf mir[\s\S]*$/,"")}\n\n### Frage des SL\n${q}`:`Aktueller Spielstand:\n${buildContext("").replace(/\n\nDie Spieler machen gerade:[\s\S]*$/,"")}\n\nFrage des SL: ${q}`;
    S.kiChat.push({role:"user",content,show:q});S.kiDraft="";save();
    $("#kchat").insertAdjacentHTML("beforeend",`<div class="kq">${esc(q)}</div>`);$("#kq").value="";
    const out=$("#kout");out.className="ka md";out.innerHTML='<span class="mut">Claude denkt nach …</span>';
    KI_BUSY=new AbortController();$("#kstop").style.display="";$("#kgo").disabled=true;
    try{
      const r=await SAMPLE(S.kiChat.map(m=>({role:m.role,content:m.content})),{cache:false,signal:KI_BUSY.signal,onText:({text})=>{out.innerHTML=md(text)}});
      S.kiChat.push({role:"assistant",content:r.text||""});save();
    }catch(e){
      const part=e&&e.text;if(part)S.kiChat.push({role:"assistant",content:part+"\n\n*(abgebrochen)*"});else S.kiChat.pop();save();
      if(e&&e.code==="not_granted"){SAMPLE=null;toast("Claude-Zugriff nicht erlaubt");}
      else if(e&&e.code==="rate_limited")toast("Zu viele Anfragen – kurz warten");
      else if(!(e&&e.name==="AbortError"))toast("Fehler: "+((e&&e.message)||e));
    }
    KI_BUSY=null;rKI();setTimeout(()=>{const k=$("#kchat");if(k&&k.lastElementChild)k.lastElementChild.scrollIntoView({block:"start"})},50);
  };
}
function rKIlink(){
  $("#main").innerHTML=`<div class="card"><b>Claude fragen</b>
   <p class="mut" style="font-size:13px;margin:4px 0 8px">Schreib kurz, was die Spieler machen. Raum, Gruppenstand, Kampf und Notizen hängt die App automatisch an.</p>
   <textarea id="kq" rows="5" style="width:100%" placeholder="z. B. Brokk will den Nalfeshnee bestechen, ihnen die Zellenschlüssel zu geben">${esc(S.kiDraft||"")}</textarea>
   <div class="row" style="margin-top:8px;gap:6px">${["Wie reagiert der NSC?","Was passiert jetzt?","Welcher Wurf / welcher SG?","Improvisiere eine Szene"].map(s=>`<button class="sm" data-qs="${s}">${s}</button>`).join("")}</div>
   <button class="pri" id="kgo" style="width:100%;margin-top:12px;padding:14px">🤖 Im DnD-Projekt fragen</button>
   <p class="mut" style="font-size:12px;margin:6px 0 0">Kopiert die Frage samt Kontext und öffnet dein DnD-Projekt in der Claude-App. Dort ins Eingabefeld tippen → <b>Einsetzen</b> → senden. Im Projekt liegen die Kapitel-Abschriften, ich kenne also den Hintergrund.</p>
   <button class="sm" id="knew" style="width:100%;margin-top:10px">Neuer Chat, Text schon eingefügt (ohne Projektwissen)</button>
  </div>
  <div class="card"><b>Vorschau</b><pre id="kpv" style="white-space:pre-wrap;font-size:12px;color:var(--mut);margin:6px 0 0;max-height:240px;overflow:auto"></pre></div>`;
  const upd=()=>{S.kiDraft=$("#kq").value;save();$("#kpv").textContent=buildContext($("#kq").value)};
  $("#kq").oninput=upd;upd();
  $("#main").querySelectorAll("[data-qs]").forEach(b=>b.onclick=()=>{$("#kq").value=($("#kq").value?$("#kq").value+" ":"")+b.dataset.qs;upd()});
  $("#kgo").onclick=()=>{const txt=buildContext($("#kq").value);clip(txt,"Kopiert – im Projekt einfügen");setTimeout(()=>{location.href=PROJ},400)};
  $("#knew").onclick=()=>{const txt=buildContext($("#kq").value).slice(0,6000);clip(txt,"Kopiert");setTimeout(()=>{location.href="https://claude.ai/new?q="+encodeURIComponent(txt)},400)};
}

/* ---------- Kontext für Claude ---------- */
function clip(t,msg){
  const ok=()=>toast(msg||"Kopiert");
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,()=>fallback(t,ok));else fallback(t,ok);
}
function fallback(t,ok){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){askText("Kopieren (markieren & kopieren):",t,true)}a.remove()}
function copyContext(){clip(buildContext(""),"Kontext kopiert – in Claude einfügen")}
function buildContext(q){
  const c=chap();const f=S.cur?findArea(S.cur):null;
  const strip=s=>String(s||"").replace(/\*\*\*|\*\*|\*/g,"");
  let t=`[Vecna – Vorabend der Verdammnis | ${c.title}]\n`;
  if(f)t+=`Aktueller Ort: ${f.a.id} ${f.a.name} (${f.m.title})\n${strip(f.a.info)}\n`;
  const done=Object.keys(S.done).filter(k=>S.done[k]).map(k=>k.replace(/^k\d+:/,''));if(done.length)t+=`\nErledigte Bereiche: ${done.join(", ")}\n`;
  const npc=Object.entries(S.npc).filter(([,v])=>v!=="?");if(npc.length)t+=`NSC-Status: ${npc.map(([k,v])=>k+": "+v).join("; ")}\n`;
  const sec=Object.entries(S.secrets).map(([k,v])=>`${k}=${v}`);if(sec.length)t+=`Geheimnisse: ${sec.join(", ")}\n`;
  if(S.combat.list.length)t+=`Kampf Runde ${S.combat.round}: ${S.combat.list.map(x=>`${x.name}${x.hp!==null?" "+x.hp+"/"+x.max+" TP":""}${x.thp?" +"+x.thp+" temp.":""}`).join("; ")}\n`;
  if(S.log.length)t+=`Letzte Ereignisse:\n- ${S.log.slice(0,8).join("\n- ")}\n`;
  if(S.notes.trim())t+=`Notizen: ${S.notes.trim().slice(0,600)}\n`;
  t+=`\nDie Spieler machen gerade: ${q||""}\n\nBitte hilf mir als SL: kurz, konkret, mit SG/Würfen wo nötig, passend zum Buch (Projektdokumente).`;
  return t;
}
