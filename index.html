<style>
/* VOICE: still, nächtlich, ein Kartentisch bei Kerzenlicht.
   IDEA: eine Pergamentkarte unter einem Tuch aus Nebel, das Stück für Stück weggezogen wird.
   PICTURE: die Karte selbst, randlos, darüber der Nebel.
   COLOUR and TYPE: Tinte #121016, Nebel #17131c, Pergament #e9dcc0, Akzent Siegelrot #b3412f; Cinzel nur im Titel.
   LAYOUT: fester Rahmen, Kopfleiste oben, Karte füllt den Rest, SL-Pult rechts oder unten. */
:root{color-scheme:dark;--bg:#121016;--panel:#1c1820;--line:#3a3240;--ink:#efe6d6;--mute:#a89c8c;--parch:#e9dcc0;--acc:#b3412f;--ok:#6f9a5a;--violet:#8a6bd1;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#26212b;border-radius:10px;min-height:44px;padding:0 14px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--parch);outline-offset:2px}
button.prim{background:var(--acc);border-color:var(--acc);color:#fff}
button.on{background:var(--parch);color:#1b1410;border-color:var(--parch)}
button:disabled{opacity:.45}
.hidden{display:none!important}
#app{position:fixed;inset:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);padding:0 var(--sr) 0 var(--sl)}
header{display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) 12px 8px;background:linear-gradient(#0d0b10,#121016);border-bottom:1px solid #241f29}
#titel{font-family:Cinzel,Georgia,serif;font-size:19px;letter-spacing:.02em;white-space:nowrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding:8px 4px}
#chips{display:flex;gap:8px;overflow-x:auto;flex:1;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;min-height:38px;border-radius:19px;font-size:14px;background:#211c25}
#chips button.on{background:var(--parch);color:#1b1410}
#hbtns{display:flex;gap:8px;flex:none}
body.sl #live span{display:none}
body.sl #toast{top:auto;bottom:calc(var(--sb) + 84px)}
#app,#dlg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#dlg input,#dlg textarea{-webkit-user-select:text;user-select:text}
body.sl #titel{display:none}
#live{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
#live i{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}
#live.an i{background:var(--ok)}
#main{position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
#view{position:relative;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 40%,#1a161e,#0b0a0d 70%)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage>*{position:absolute;left:0;top:0;pointer-events:none}
#karte{user-select:none;-webkit-user-drag:none}
#fog{transition:opacity .25s}
body.sl #fog{opacity:.62}
.door .dl{font:700 13px -apple-system,sans-serif;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3.5px;text-anchor:middle}
.door.block circle{fill:#e9b9a8;stroke:#7a2414}.door.block path,.door.block rect{stroke:#7a2414}.door.block path.x{stroke-width:3}
.door.leucht{opacity:1!important}.door.leucht circle{fill:#7ee07a;stroke:#1f6d22;stroke-width:3.5}.door.leucht path,.door.leucht rect{stroke:#14451a}

#fit{position:absolute;right:calc(12px);bottom:calc(var(--sb) + 12px);width:48px;height:48px;border-radius:24px;padding:0;background:#1c1820e6;display:grid;place-items:center}
.door circle{fill:#efe2c4;stroke:#2b1f16;stroke-width:2.5}
.door path,.door rect{fill:none;stroke:#2b1f16;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.door.frei circle{fill:#f3e9b8}
.rl{font:700 13px -apple-system,sans-serif;fill:#fff;paint-order:stroke;stroke:#000;stroke-width:3.5px;text-anchor:middle;dominant-baseline:middle}
.rl.zu{fill:#ffcf8a}
/* SL-Pult */
body.sl #app{grid-template-rows:auto auto minmax(0,1fr)}
body:not(.sl) .slnur{display:none!important}
body.sl #chips{display:none}
#menue{flex:1;display:flex;align-items:center;gap:8px;min-width:0;min-height:40px;text-align:left;padding:0 10px}
#menuetitel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
#kmenue{position:fixed;inset:0;z-index:15;background:#0007}
#kliste{position:absolute;left:calc(var(--sl) + 8px);right:calc(var(--sr) + 8px);top:calc(var(--st) + 58px);max-width:460px;max-height:calc(100dvh - var(--st) - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px #000a;padding:6px 0 10px;-webkit-overflow-scrolling:touch}

.kz.akt{background:#2a2430}
.kz label{display:grid;place-items:center;width:44px;height:44px;flex:none}

.kz button{flex:1;border:0;background:none;text-align:left;min-height:44px;padding:0 6px;font-size:15.5px;border-radius:8px}
.kz button.on{color:var(--parch);font-weight:600}
.kz i{font-style:normal;font-size:12px;color:#9fd18a;white-space:nowrap;padding-right:6px}
.klegende{margin:8px 14px 0;font-size:12.5px;color:var(--mute)}
#kwahl{flex:1;min-width:0;min-height:40px;background:#26212b;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:16px}
button.ico{width:44px;padding:0;display:grid;place-items:center}
#slzeile{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px 10px 8px;background:#121016;border-bottom:1px solid #241f29}
#slzeile button{min-height:40px;font-size:14px;padding:0 6px}
#slzeile #zeigen.on{background:#2c3a25;border-color:#55743f;color:#cfe6bd}
#slleiste{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);display:flex;gap:6px;padding:6px;background:#1c1820ee;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 20px #0009;z-index:5}
#slleiste button{min-height:44px;font-size:14px;padding:0 12px;white-space:nowrap}
#slleiste #freigeben:not(:disabled){background:var(--acc);border-color:var(--acc);color:#fff}
body.sl #fit{bottom:calc(var(--sb) + 76px)}
#pend{opacity:.9}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.raster button{padding:0;font-variant-numeric:tabular-nums}
.raster button.start{box-shadow:inset 0 0 0 2px var(--ok)}
.zeile{display:flex;gap:8px;align-items:center}
.zeile>span{flex:1}
.tl{display:flex;flex-direction:column;gap:8px}
.tl>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl>div>span{flex:1 1 140px;font-size:14px}
.tag{font-size:12px;padding:2px 8px;border-radius:9px;background:#2d2733;color:var(--mute);white-space:nowrap}
.tag.g{background:#33285a;color:#d9ccf5}.tag.f{background:#4a4320;color:#f3e9b8}
.hinweis{font-size:13px;color:var(--mute)}
label.sw{display:flex;align-items:center;gap:10px;min-height:44px}
label.sw input{width:22px;height:22px;accent-color:var(--acc)}

  #slleiste button{padding:0 9px;font-size:13.5px}
  #fit{bottom:12px}
}
/* Sperrbildschirm & Dialoge */
#sperre{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 30%,#2a2230,#0b0a0d 70%)}

#sperre h1{font-family:Cinzel,Georgia,serif;font-weight:600;font-size:34px;line-height:1.05;margin:0;color:var(--parch);text-align:center}
#sperre p{margin:0;text-align:center;color:var(--mute)}
input[type=password],input[type=text],textarea{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);background:#1a161e;padding:10px 12px;font-size:16px}
#fehler{color:#f0a090;min-height:1.4em;text-align:center;font-size:15px}
#dlg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}
#dlg>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(440px,100%);max-height:86dvh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
#dlg h2{margin:0;font-family:Cinzel,Georgia,serif;font-weight:600;font-size:20px;color:var(--parch)}
#dlg .knoepfe{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#dlg textarea{min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace}
#toast{position:fixed;left:50%;top:calc(var(--st) + 64px);transform:translateX(-50%);background:#000d;color:var(--ink);padding:10px 16px;border-radius:12px;z-index:30;font-size:15px;max-width:90vw;text-align:center}

body.sl #app{grid-template-rows:auto auto minmax(0,1fr) auto}
body.sl #main{grid-row:3}
#slnav{grid-row:4;display:flex;background:#0d0b10;border-top:1px solid #241f29;padding-bottom:var(--sb)}
#slnav button{flex:1;border:0;border-radius:0;background:none;min-height:54px;padding:6px 2px 5px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute)}
#slnav button .i{font-size:20px;line-height:1}
#slnav button.on{color:var(--parch);font-weight:700;background:#ffffff12}
body.sl #slleiste{bottom:12px}
body.sl #fit{bottom:76px}
body.sl #toast{bottom:84px}
#slf{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:12;display:none;background:#f2f0eb}
body.sltab #slf{display:block}
body.sltab header,body.sltab #slzeile,body.sltab #slleiste,body.sltab #fit{display:none!important}
#sllade{position:absolute;inset:0;z-index:13;display:none;place-items:center;background:#f2f0eb;color:#5f707b;font:16px -apple-system,sans-serif}
body.sltab #sllade.an{display:grid}
@media (prefers-reduced-motion:reduce){#fog{transition:none}}
</style>

/* ---------- Live (Claude-Artefakt mit gemeinsamer Datenbank) ---------- */
async function liveStart(){
  if(!IN_CLAUDE)return;
  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db)return;
  live={db,dirty:new Set(),busy:false,timer:null,ok:false};
  const badge=(t,an)=>{$('#live').classList.remove('hidden');$('#live').classList.toggle('an',!!an);$('#live span').textContent=t};
  badge('verbinde …',false);
  const warte=setTimeout(()=>{if(!live.ok)badge('offline',false)},10000);
  live.push=teil=>{live.dirty.add(teil);clearTimeout(live.timer);live.timer=setTimeout(schreiben,350)};
  async function schreiben(){
    if(live.busy)return;live.busy=true;
    try{
      while(live.dirty.size){
        const teil=[...live.dirty][0];live.dirty.delete(teil);
        const data=teil==='meta'?{aktiv:state.aktiv,frei:state.frei,opts:state.opts,n:Date.now()}:{ops:state.karten[teil].ops,tuer:state.karten[teil].tuer,sv:state.karten[teil].sv||0,n:Date.now()};
        try{await db.doc(teil==='meta'?'spiel/meta':'karten/'+teil).set(data)}
        catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));live.dirty.add(teil)}else{toast('Speichern fehlgeschlagen: '+(e&&e.code||e));if(e&&(e.code==='invalid_argument'||e.code==='quota_exceeded'))break}}
      }
    }finally{live.busy=false}
  }
  db.doc('spiel/meta').onSnapshot(s=>{
    if(!s.metadata.fromCache){live.ok=true;clearTimeout(warte);badge('Live',true)}
    if(live.dirty.has('meta'))return;
    if(!s.exists){if(!s.metadata.fromCache&&(state.aktiv||Object.keys(state.frei).length)){live.push('meta');Object.keys(state.karten).forEach(k=>live.push(k))}return}
    const d=s.data();const altAktiv=state.aktiv;
    state.aktiv=d.aktiv||null;state.frei=Object.assign({},d.frei||{});state.opts=Object.assign({tueren:true},d.opts||{});
    LS.set(STK,JSON.stringify(state));
    if(state.aktiv!==altAktiv&&state.aktiv&&MAPS[state.aktiv]&&state.aktiv!==cur){oeffne(state.aktiv);if(sl)toast('Spieler sind jetzt auf '+MAPS[state.aktiv].titel)}
    else if(!sl&&cur&&!state.frei[cur]&&cur!==state.aktiv)oeffne(state.aktiv||ersteFreie());
    chips();pult();
  },e=>badge('getrennt',false));
  db.collection('karten').onSnapshot(q=>{
    for(const ch of q.docChanges()){
      const id=ch.doc.id;if(!MAPS[id]||live.dirty.has(id)||ch.type==='removed')continue;
      const d=ch.doc.data();const altT=(state.karten[id]&&state.karten[id].tuer)||{};
      const neuT=Object.assign({},d.tuer||{});
      if(live.erst&&sl)for(const [key,v] of Object.entries(neuT)){if(v===altT[key])continue;if(/^t\d+v$/.test(key))anfrage(id,key.slice(0,-1));if(/^t\d+q$/.test(key))anfrageZu(id,key.slice(0,-1))}
      state.karten[id]={ops:(d.ops||[]).slice(),tuer:neuT,sv:d.sv||0};
      if(id===cur){zeichneNebel();zeichneOverlay()}
    }
    LS.set(STK,JSON.stringify(state));pult();live.erst=true;
  },e=>badge('getrennt',false));
}

  const box=dialog('Sicherung importieren','<textarea id="im" placeholder="Sicherung hier einfügen"></textarea><input type="file" id="imf" accept=".json,application/json"><p class="hinweis">Ersetzt den kompletten Stand auf diesem Gerät (und im Live-Modus auf allen Geräten).</p>',[{t:'Abbrechen'},{t:'Übernehmen',c:'prim',f:b=>{
    try{const s=JSON.parse(b.querySelector('#im').value);if(!s||s.v!==1||typeof s.karten!=='object')throw 0;
      state=Object.assign(leer(),s);geaendert('meta');Object.keys(state.karten).forEach(k=>live&&live.push(k));
      oeffne(sl?cur:(state.aktiv||ersteFreie()));toast('Sicherung übernommen.')}catch(e){toast('Das ist keine gültige Sicherung.');return false}}}]);
  box.querySelector('#imf').onchange=async e=>{const f=e.target.files[0];if(f)box.querySelector('#im').value=await f.text()};
}
function pinNeu(){
  dialog('Neue SL-PIN','<input id="p1" type="password" inputmode="numeric" placeholder="Neue PIN (mind. 4 Zeichen)"><input id="p2" type="password" inputmode="numeric" placeholder="Wiederholen" style="margin-top:8px"><p class="hinweis">Gilt nur auf diesem Gerät.</p>',[{t:'Abbrechen'},{t:'Speichern',c:'prim',f:async b=>{
    const a=b.querySelector('#p1').value,c=b.querySelector('#p2').value;if(a.length<4||a!==c){toast('PINs stimmen nicht überein oder sind zu kurz.');return false}
    if(!LS.set(PINK,await sha(B.pin.s+a))){toast('Konnte nicht gespeichert werden.');return false}toast('PIN geändert.')}}]);
}

/* ---------- Automatisch entsperren ---------- */
const gem=LS.get(PWK)||cookiePw();
if(gem){$('#pw').value='';entsperren(gem,true)}
}
